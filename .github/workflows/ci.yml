name: CI

# The pack carries the authoring shims: the asset library, the script
# contract, the plan assembler and the LLM connectors now live in the three
# packages on PyPI. Installing them from PyPI - not from a local checkout -
# is what makes this a real test of what a user gets.
#
# The suite is a plain pytest run: no ComfyUI, no GPU, no model.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install what a user gets
        shell: bash
        run: |
          # ComfyUI installs a custom node from its requirements.txt, so
          # that file is what a fresh install actually gets. Installing
          # it here means the runner tests the same set of packages the
          # user's ComfyUI would, and the file cannot drift from what
          # the pack needs without the suite noticing.
          #
          # The authoring packages come from PyPI here, exactly as they
          # do for a user.
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "comfyui-mie-craft==0.1.4"

      - name: Install the test dependencies
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow
          # The image helpers of mie_llm.media encode through opencv, and
          # the qwen captioner test exercises that path for real. The
          # headless build is the one that belongs on a runner.
          python -m pip install opencv-python-headless
          # A schema test that validates a designed asset against the
          # shipped JSON schema. Without this it skips, and the schema
          # would go unchecked.
          python -m pip install jsonschema

      - name: Run the suite
        shell: bash
        run: python -m pytest tests/ -q -rs
