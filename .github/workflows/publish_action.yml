name: Publish to Comfy registry

# The automatic trigger is removed: a push to main that touches
# pyproject.toml used to publish straight away. That is not safe right now.
# The authoring layer moved out of this pack (2026-11-06) and is three
# packages on PyPI now: comfyui-mie-llm, comfyui-mie-prompt and
# comfyui-mie-craft, all at one version.
#
# Publishing again needs:
#   1. the dependency declared in pyproject.toml to be installable from
#      PyPI (it is), and the version here to match;
#   2. REGISTRY_ACCESS_TOKEN in this repository's secrets;
#   3. this workflow run by hand.

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'MieMieeeee' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
