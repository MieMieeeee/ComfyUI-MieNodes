name: Publish to Comfy registry

# The automatic trigger is removed: a push to main that touches
# pyproject.toml used to publish straight away. That is not safe right now.
# The authoring layer moved to ComfyUI-Mie-Core (2026-11-06), which this
# pack needs at runtime but which is not yet on PyPI, so a published build
# would install and then fail to import.
#
# Publishing again needs:
#   1. ComfyUI-Mie-Core on PyPI, and the dependency declared here;
#   2. REGISTRY_ACCESS_TOKEN in this repository's secrets;
#   3. this workflow run by hand.

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'MieMieeeee' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
