[project]
name = "comfyui_mienodes"
description = "Offering a series of utility nodes designed to simplify workflows and enhance efficiency"
version = "1.5.2"
license = { file = "LICENSE" }
dependencies = [
    # The authoring layer - the asset library, the script contract, the
    # plan assembler, the prompt templates and the LLM connectors - is three
    # packages on PyPI. They are released as one train with one version.
    "comfyui-mie-llm>=0.1.4",
    "comfyui-mie-prompt>=0.1.4",
    "comfyui-mie-craft>=0.1.4",
    # The pack's own runtime dependencies, imported at module level.
    # ComfyUI supplies torch, numpy, pillow, opencv, torchaudio and
    # requests itself; these three are ours and were undeclared, so a
    # fresh install only learned about them by failing.
    "toml",
    "deepdiff",
    "tqdm",
]

[project.urls]
Repository = "https://github.com/MieMieeeee/ComfyUI-MieNodes"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "mie"
DisplayName = "ComfyUI_MieNodes"
Icon = "https://github.com/MieMieeeee/ComfyUI-MieNodes/blob/2f617ba2539e8fd13a91fe790e6b5e9ae1718a58/images/channels4_profile.jpg?raw=true"

[tool.pytest.ini_options]
consider_namespace_packages = false
